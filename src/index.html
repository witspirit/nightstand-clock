<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Nightstand Clock</title>
    <!-- Bump the shared asset version when shipped CSS/JS changes. -->
    <link rel="stylesheet" href="style.css?v=earth-2">
</head>

<body>
    <div id="earth-backdrop" aria-hidden="true">
        <img id="earth-still" alt="">
        <canvas id="earth-surface" width="512" height="512"></canvas>
    </div>
    <div id="clock-container">
        <div id="clock-face">
            <div id="ticks"></div>
            <div id="digital-container">
                <div id="digital-time">--:--</div>
                <div id="digital-date">--</div>
            </div>
            <div id="hour-hand" class="hand"></div>
            <div id="minute-hand" class="hand"></div>
            <div id="second-hand" class="hand"></div>
            <div id="center-dot"></div>
        </div>
    </div>
    <script src="script.js?v=earth-2"></script>
    <script src="earth-math.js?v=earth-2"></script>
    <script src="earth.js?v=earth-2"></script>
</body>

</html>
