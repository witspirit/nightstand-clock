<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Nightstand Clock</title>
    <!-- Bump the shared asset version when shipped CSS/JS changes. -->
    <link rel="stylesheet" href="style.css?v=brightness-2">
</head>

<body>
    <div id="earth-backdrop" aria-hidden="true">
        <img id="earth-still" alt="">
        <canvas id="earth-surface" width="512" height="512"></canvas>
    </div>
    <div id="clock-container" style="opacity: 0.12">
        <div id="clock-face">
            <div id="ticks"></div>
            <div id="digital-container">
                <div id="digital-time">--:--</div>
                <div id="digital-date">--</div>
            </div>
            <div id="hour-hand" class="hand"></div>
            <div id="minute-hand" class="hand"></div>
            <div id="second-hand" class="hand"></div>
            <div id="center-dot"></div>
        </div>
    </div>
    <button id="brightness-toggle" type="button" aria-label="Show brightness controls"
        aria-controls="brightness-panel" aria-expanded="false"></button>
    <section id="brightness-panel" role="region" aria-label="Brightness controls" hidden>
        <div class="brightness-heading">Brightness <button id="brightness-close" type="button">Hide</button></div>
        <div id="brightness-mode" role="group" aria-label="Profile">
            <button type="button" data-profile="auto" aria-pressed="true">Auto</button>
            <button type="button" data-profile="day" aria-pressed="false">Day</button>
            <button type="button" data-profile="night" aria-pressed="false">Night</button>
        </div>
        <p id="brightness-profile"></p>
        <label for="clock-brightness">Clock <span id="clock-brightness-value"></span></label>
        <input id="clock-brightness" type="range" min="0" max="100" step="1" value="12">
        <label for="earth-brightness">Earth <span id="earth-brightness-value"></span></label>
        <input id="earth-brightness" type="range" min="0" max="100" step="1" value="40">
        <p>Auto: Day 08:00–20:00, Night 20:00–08:00 (local time). Select Day or Night to adjust and preview it.</p>
        <p id="brightness-storage">Settings save on this device. Tap the top-right corner to show or hide controls.</p>
    </section>
    <!-- Apply saved intensity before starting the clock or loading Earth imagery. -->
    <script src="brightness.js?v=brightness-2"></script>
    <script src="script.js?v=brightness-2"></script>
    <script src="earth-math.js?v=brightness-2"></script>
    <script src="earth.js?v=brightness-2"></script>
</body>

</html>
